<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42">
  <!-- GoldenSpinHQ mark: plum tile, gold spin arc with an arrowhead, sparkle
       at the centre.
       The first <rect fill> is read by app/apple-icon.tsx as the background
       plate, so it must stay the first element. -->
  <defs>
    <linearGradient id="gs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset=".45" stop-color="#e8b43c"/>
      <stop offset="1" stop-color="#a66e14"/>
    </linearGradient>
  </defs>
  <rect width="42" height="42" rx="11" fill="#1f0f19"/>
  <path d="M31.2 13.6A12.5 12.5 0 1 0 33.5 22H22.5" fill="none" stroke="url(#gs)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M27.4 8.2l6.6 3.4-3.6 6.4z" fill="url(#gs)"/>
  <path d="M21 16.2l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9-2.9-1.1 2.9-1.1z" fill="#ffe9a3"/>
</svg>
